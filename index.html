<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wawuji - Apple Numbers & API Delivery Workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans" x-data="wawujiApp()">

    <!-- Top Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black text-rose-600 tracking-tight cursor-pointer" @click="currentView = 'home'">wawuji<span class="text-slate-900">.com</span></span>
                <nav class="hidden md:flex space-x-6 ml-8 text-sm font-medium text-slate-600">
                    <button @click="currentView = 'home'" :class="currentView === 'home' ? 'text-rose-600 font-bold' : 'hover:text-rose-600'">Card Issuing</button>
                    <button @click="currentView = 'products'" :class="currentView === 'products' ? 'text-rose-600 font-bold' : 'hover:text-rose-600'">Product Center</button>
                    <button @click="currentView = 'finance'" :class="currentView === 'finance' ? 'text-rose-600 font-bold' : 'hover:text-rose-600'">Finance</button>
                    <button @click="currentView = 'orders'" :class="currentView === 'orders' ? 'text-rose-600 font-bold' : 'hover:text-rose-600'">Orders & Delivery</button>
                    <button @click="currentView = 'messages'" :class="currentView === 'messages' ? 'text-rose-600 font-bold' : 'hover:text-rose-600'">SMS Inbox</button>
                </nav>
            </div>
            
            <div class="flex items-center space-x-4">
                <template x-if="isLoggedIn">
                    <div class="flex items-center space-x-4">
                        <span class="text-sm font-semibold bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">Balance: <span class="text-emerald-600 font-bold" x-text="`$${balance.toFixed(2)}`"></span></span>
                        <button @click="currentView = 'console'" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition">Console</button>
                        <button @click="logout()" class="text-slate-400 hover:text-rose-600 text-xs font-medium">Logout</button>
                    </div>
                </template>
                <template x-if="!isLoggedIn">
                    <div class="space-x-2">
                        <button @click="authModal = 'login'; showAuthModal = true;" class="text-slate-600 hover:text-slate-900 px-3 py-2 text-sm font-medium">Log in</button>
                        <button @click="authModal = 'register'; showAuthModal = true;" class="bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-rose-700 transition">Create account</button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- NOTIFICATION TOAST -->
        <div x-show="showAlert" x-transition class="fixed bottom-5 right-5 bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl z-50 text-sm flex items-center space-x-3">
            <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
            <span x-text="alertMessage"></span>
        </div>

        <!-- 1. HOME VIEW -->
        <template x-if="currentView === 'home'">
            <div>
                <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white rounded-2xl p-8 mb-8 shadow-xl">
                    <h1 class="text-3xl font-black mb-3">US Numbers & API Delivery in one workspace.</h1>
                    <p class="text-slate-300 text-sm max-w-2xl mb-6">Instant delivery of American numbers with active API endpoints and TXT file export capability for Apple services.</p>
                    <button @click="if(isLoggedIn) { currentView = 'products'; } else { showAuthModal = true; authModal = 'register'; }" class="bg-rose-600 text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-rose-700 transition shadow-lg">Get Started Now</button>
                </div>
            </div>
        </template>

        <!-- 2. PRODUCT CATALOG VIEW -->
        <template x-if="currentView === 'products'">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900">Product Catalog / Apple US Numbers</h2>
                        <p class="text-xs text-slate-500 mt-1">Special price: 30 US numbers for $20.00 with complete API links.</p>
                    </div>
                    <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold">Stock Ready</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Package 30 Qty ($20) -->
                    <div class="bg-white border-2 border-rose-600 rounded-2xl p-6 shadow-md relative flex flex-col justify-between">
                        <span class="absolute -top-3 right-4 bg-rose-600 text-white text-[10px] font-bold px-3 py-0.5 rounded-full uppercase">Most Popular</span>
                        <div>
                            <div class="text-rose-600 font-bold text-xs uppercase mb-1">US Apple Service</div>
                            <h3 class="text-lg font-bold text-slate-900 mb-2">30 US Numbers + API</h3>
                            <p class="text-xs text-slate-500 mb-4">Includes 30 American numbers, individual API webhook URLs, and instant TXT download.</p>
                            <div class="text-3xl font-black text-slate-900 mb-4">$20.00 <span class="text-xs font-normal text-slate-400">($0.67 / number)</span></div>
                        </div>
                        <button @click="buyPackage(30, 20.00, 'Apple US Numbers (30 Qty)')" class="w-full bg-rose-600 text-white py-3 rounded-xl text-sm font-medium hover:bg-rose-700 transition shadow-lg">Buy 30 Numbers ($20)</button>
                    </div>

                    <!-- Package 60 Qty ($40) -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="text-rose-600 font-bold text-xs uppercase mb-1">US Apple Service</div>
                            <h3 class="text-lg font-bold text-slate-900 mb-2">60 US Numbers + API</h3>
                            <p class="text-xs text-slate-500 mb-4">Double bundle with high-speed API endpoints and automated delivery.</p>
                            <div class="text-3xl font-black text-slate-900 mb-4">$40.00 <span class="text-xs font-normal text-slate-400">($0.67 / number)</span></div>
                        </div>
                        <button @click="buyPackage(60, 40.00, 'Apple US Numbers (60 Qty)')" class="w-full bg-slate-900 text-white py-3 rounded-xl text-sm font-medium hover:bg-slate-800 transition">Buy 60 Numbers ($40)</button>
                    </div>

                    <!-- Package 90 Qty ($60) -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="text-rose-600 font-bold text-xs uppercase mb-1">US Apple Service</div>
                            <h3 class="text-lg font-bold text-slate-900 mb-2">90 US Numbers + API</h3>
                            <p class="text-xs text-slate-500 mb-4">Bulk commercial pack with full API management & 90-day renewals.</p>
                            <div class="text-3xl font-black text-slate-900 mb-4">$60.00 <span class="text-xs font-normal text-slate-400">($0.67 / number)</span></div>
                        </div>
                        <button @click="buyPackage(90, 60.00, 'Apple US Numbers (90 Qty)')" class="w-full bg-slate-900 text-white py-3 rounded-xl text-sm font-medium hover:bg-slate-800 transition">Buy 90 Numbers ($60)</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- 3. CONSOLE VIEW -->
        <template x-if="currentView === 'console'">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 mb-6">User Console</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-xs">
                        <div class="text-xs text-slate-500 mb-1">Balance</div>
                        <div class="text-xl font-bold text-slate-900" x-text="`$${balance.toFixed(2)}`"></div>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-xs">
                        <div class="text-xs text-slate-500 mb-1">Total Orders</div>
                        <div class="text-xl font-bold text-slate-900" x-text="orders.length"></div>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-xs">
                        <div class="text-xs text-slate-500 mb-1">API Status</div>
                        <div class="text-xl font-bold text-emerald-600">Connected</div>
                    </div>
                </div>
            </div>
        </template>

        <!-- 4. FINANCE VIEW -->
        <template x-if="currentView === 'finance'">
            <div class="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
                <h2 class="text-xl font-bold text-slate-900 mb-2">Balance Recharge</h2>
                <p class="text-xs text-slate-500 mb-6">Top up your balance to buy US numbers instantly.</p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Amount ($)</label>
                        <input type="number" x-model.number="rechargeAmount" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm">
                    </div>
                    <button @click="rechargeWallet()" class="w-full bg-rose-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-rose-700 transition">Confirm Recharge</button>
                </div>
            </div>
        </template>

        <!-- 5. ORDERS & DELIVERIES VIEW -->
        <template x-if="currentView === 'orders'">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Order History & Deliveries</h2>
                <template x-if="orders.length === 0">
                    <div class="bg-white rounded-xl border border-slate-200 p-12 text-center text-slate-400 text-sm">
                        No orders placed yet. Go to Product Center to get your US numbers.
                    </div>
                </template>
                <template x-if="orders.length > 0">
                    <div class="space-y-6">
                        <template x-for="order in orders" :key="order.id">
                            <div class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
                                <div class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b border-slate-100 mb-4">
                                    <div>
                                        <div class="text-xs font-mono text-slate-400" x-text="order.id"></div>
                                        <h4 class="font-bold text-slate-900 text-lg" x-text="order.title"></h4>
                                        <p class="text-xs text-slate-500 mt-0.5">Status: <span class="text-emerald-600 font-bold">Delivered</span> | Date: <span x-text="order.date"></span></p>
                                    </div>
                                    <div class="mt-4 md:mt-0 flex items-center space-x-3">
                                        <span class="font-bold text-slate-900 text-lg" x-text="`$${order.price.toFixed(2)}`"></span>
                                        <button @click="downloadTxt(order)" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-emerald-700 transition flex items-center space-x-1">
                                            <span>Download TXT</span>
                                        </button>
                                        <button @click="copyOrderData(order)" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-medium hover:bg-slate-800">Copy Numbers</button>
                                    </div>
                                </div>

                                <!-- US Numbers & API List Preview -->
                                <div class="bg-slate-50 rounded-lg p-4 border border-slate-200">
                                    <h5 class="text-xs font-bold text-slate-700 mb-2 uppercase tracking-wide">Generated US Numbers & API Endpoints:</h5>
                                    <div class="space-y-2 max-h-48 overflow-y-auto pr-2">
                                        <template x-for="item in order.items" :key="item.number">
                                            <div class="bg-white p-3 rounded border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center text-xs">
                                                <div>
                                                    <span class="font-mono font-bold text-rose-600 text-sm" x-text="item.number"></span>
                                                    <span class="text-slate-400 ml-2">(US - California)</span>
                                                </div>
                                                <div class="mt-1 md:mt-0 font-mono text-slate-500 bg-slate-100 px-2 py-1 rounded truncate max-w-xs" x-text="item.apiLink"></div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <!-- 6. SMS INBOX VIEW -->
        <template x-if="currentView === 'messages'">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 mb-6">SMS Inbox & Webhook Logs</h2>
                <div class="space-y-4">
                    <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-xs flex justify-between items-center">
                        <div>
                            <div class="text-xs text-slate-400 font-mono">+1 (209) 555-0148 (US)</div>
                            <div class="text-sm font-bold text-slate-900 mt-1">Apple ID Code: <span class="text-rose-600">492-810</span></div>
                        </div>
                        <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-semibold">Active API</span>
                    </div>
                </div>
            </div>
        </template>

    </main>

    <!-- AUTH MODAL -->
    <div x-show="showAuthModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div @click.outside="showAuthModal = false" class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl relative">
            <button @click="showAuthModal = false" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">&times;</button>
            <h3 class="text-2xl font-black text-slate-900 mb-2" x-text="authModal === 'login' ? 'Welcome Back' : 'Create Account'"></h3>
            <div class="space-y-4 mt-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
                    <input type="email" x-model="authEmail" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm">
                </div>
                <button @click="handleAuth()" class="w-full bg-rose-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-rose-700 transition" x-text="authModal === 'login' ? 'Log in' : 'Register'"></button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        function wawujiApp() {
            return {
                currentView: 'home',
                isLoggedIn: false,
                balance: 100.00,
                rechargeAmount: 20,
                showAuthModal: false,
                authModal: 'login',
                authEmail: '',
                showAlert: false,
                alertMessage: '',
                orders: [],

                handleAuth() {
                    this.isLoggedIn = true;
                    this.showAuthModal = false;
                    this.showAlertMessage('Logged in successfully!');
                },

                logout() {
                    this.isLoggedIn = false;
                    this.currentView = 'home';
                },

                rechargeWallet() {
                    this.balance += Number(this.rechargeAmount);
                    this.showAlertMessage(`Added $${this.rechargeAmount} to balance!`);
                    this.currentView = 'console';
                },

                buyPackage(qty, price, title) {
                    if(!this.isLoggedIn) {
                        this.showAuthModal = true;
                        this.authModal = 'login';
                        return;
                    }
                    if(this.balance < price) {
                        alert('Insufficient balance! Please recharge.');
                        this.currentView = 'finance';
                        return;
                    }
                    this.balance -= price;

                    let generatedItems = [];
                    for(let i = 1; i <= qty; i++) {
                        let randomNum = '+1 (' + Math.floor(200 + Math.random() * 799) + ') ' + Math.floor(100 + Math.random() * 899) + '-' + Math.floor(1000 + Math.random() * 8999);
                        let token = Math.random().toString(36).substring(2, 12);
                        generatedItems.push({
                            number: randomNum,
                            apiLink: `https://api.wawuji.com/v1/sms?num=${encodeURIComponent(randomNum)}&token=${token}`
                        });
                    }

                    this.orders.unshift({
                        id: 'MOG-ORD-' + Math.floor(100000 + Math.random() * 900000),
                        title: title,
                        price: price,
                        date: new Date().toLocaleDateString(),
                        items: generatedItems
                    });

                    this.showAlertMessage('Order completed! US numbers & API links generated.');
                    this.currentView = 'orders';
                },

                copyOrderData(order) {
                    let textToCopy = order.items.map(i => `${i.number} | API: ${i.apiLink}`).join('\n');
                    navigator.clipboard.writeText(textToCopy);
                    this.showAlertMessage('All numbers and API links copied to clipboard!');
                },

                downloadTxt(order) {
                    let content = `=== WAWUJI.COM - ORDER DELIVERY ===\nOrder ID: ${order.id}\nPackage: ${order.title}\nDate: ${order.date}\nTotal Price: $${order.price}\n\n--- US NUMBERS & API ENDPOINTS ---\n\n`;
                    order.items.forEach((item, index) => {
                        content += `${index + 1}. Number: ${item.number}\n   API Endpoint: ${item.apiLink}\n\n`;
                    });

                    let blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    let url = URL.createObjectURL(blob);
                    let a = document.createElement('a');
                    a.href = url;
                    a.download = `${order.id}-us-numbers.txt`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    this.showAlertMessage('TXT file downloaded successfully!');
                },

                showAlertMessage(msg) {
                    this.alertMessage = msg;
                    this.showAlert = true;
                    setTimeout(() => { this.showAlert = false; }, 3500);
                }
            }
        }
    </script>
</body>
</html>
